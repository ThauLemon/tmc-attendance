<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TMC Kiosk</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    input, select, button { font-size: 1rem; padding: .5rem; }
    input { width: 100%; box-sizing: border-box; margin-bottom: .5rem; }
    pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Kiosk</h1>
  <p>SKELETON: ô dán token (phương án dự phòng khi webcam không đọc được). TODO Nam: quét bằng webcam.</p>
  <input id="token" placeholder="Dán QR token, ví dụ EMP:E0001">
  <select id="direction"><option>IN</option><option>OUT</option></select>
  <button id="scan">Quét</button>
  <pre id="result"></pre>
  <script>
    document.getElementById('scan').addEventListener('click', async () => {
      const res = await fetch('/api/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token: document.getElementById('token').value,
          direction: document.getElementById('direction').value
        })
      });
      document.getElementById('result').textContent = JSON.stringify(await res.json(), null, 2);
    });
  </script>
</body>
</html>
