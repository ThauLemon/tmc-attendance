<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TMC Kiosk</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #172033; }
    h1 { margin-bottom: .35rem; }
    p { line-height: 1.5; }
    label { display: block; margin: 1rem 0 .4rem; font-weight: 600; }
    input, select, button { box-sizing: border-box; min-height: 2.75rem; padding: .6rem .75rem; font: inherit; }
    input, select { width: 100%; border: 1px solid #aeb8c8; border-radius: .4rem; }
    button { border: 0; border-radius: .4rem; background: #174ea6; color: white; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    .secondary { background: #48566c; }
    .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
    #scanner { margin-top: 1rem; overflow: hidden; border-radius: .5rem; background: #101828; }
    video { display: block; width: 100%; max-height: 60vh; object-fit: cover; }
    #status { min-height: 1.5rem; }
    #status[data-error="true"] { color: #b42318; }
    pre { overflow-wrap: anywhere; white-space: pre-wrap; padding: 1rem; border-radius: .4rem; background: #f1f4f9; }
  </style>
</head>
<body>
  <h1>Kiosk</h1>
  <p>Quét mã QR bằng camera hoặc nhập token thủ công.</p>

  <label for="direction">Chiều chấm công</label>
  <select id="direction">
    <option value="IN">Vào</option>
    <option value="OUT">Ra</option>
  </select>

  <div class="actions">
    <button id="start-camera" type="button">Bật camera và quét QR</button>
    <button id="stop-camera" class="secondary" type="button" disabled>Dừng camera</button>
  </div>
  <div id="scanner" hidden>
    <video id="preview" autoplay playsinline muted aria-label="Khung hình camera quét QR"></video>
  </div>

  <form id="manual-form">
    <label for="token">Hoặc nhập token QR</label>
    <input id="token" name="token" placeholder="Ví dụ: EMP:E0001"
           autocomplete="off" autocapitalize="off" spellcheck="false" required>
    <button type="submit">Gửi lượt quét</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>
  <pre id="result" aria-live="polite"></pre>

  <script>
    const startButton = document.getElementById('start-camera');
    const stopButton = document.getElementById('stop-camera');
    const scanner = document.getElementById('scanner');
    const preview = document.getElementById('preview');
    const tokenInput = document.getElementById('token');
    const directionInput = document.getElementById('direction');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    let cameraStream = null;

    function showStatus(message, isError = false) {
      status.textContent = message;
      status.dataset.error = String(isError);
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      preview.srcObject = null;
      scanner.hidden = true;
      startButton.disabled = false;
      stopButton.disabled = true;
    }

    async function submitToken(token) {
      const cleanToken = token.trim();
      if (!cleanToken) {
        showStatus('Vui lòng quét mã QR hoặc nhập token.', true);
        return;
      }

      result.textContent = '';
      showStatus('Đang xử lý lượt quét...');
      try {
        const response = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: cleanToken,
            direction: directionInput.value
          })
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data?.message || `Máy chủ trả về lỗi ${response.status}`);
        }
        result.textContent = JSON.stringify(data, null, 2);
        showStatus(data.status === 'REJECTED' ? 'Token bị từ chối.' : 'Đã nhận kết quả lượt quét.');
      } catch (error) {
        showStatus(`Không gửi được lượt quét: ${error.message}`, true);
      }
    }

    async function scanFrames(stream, detector) {
      while (cameraStream === stream) {
        if (preview.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
          try {
            const codes = await detector.detect(preview);
            if (codes.length > 0) {
              const token = codes[0].rawValue;
              stopCamera();
              tokenInput.value = token;
              await submitToken(token);
              return;
            }
          } catch (error) {
            stopCamera();
            showStatus(`Không đọc được QR: ${error.message}`, true);
            return;
          }
        }
        await new Promise(resolve => setTimeout(resolve, 120));
      }
    }

    startButton.addEventListener('click', async () => {
      startButton.disabled = true;
      showStatus('Đang khởi động camera...');
      try {
        if (!('BarcodeDetector' in window)) {
          throw new Error('Trình duyệt chưa hỗ trợ quét QR bằng camera. Hãy dùng ô nhập token.');
        }
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error('Camera cần HTTPS hoặc localhost và quyền truy cập thiết bị.');
        }
        const formats = await BarcodeDetector.getSupportedFormats();
        if (!formats.includes('qr_code')) {
          throw new Error('Trình duyệt không hỗ trợ nhận diện mã QR.');
        }

        const detector = new BarcodeDetector({ formats: ['qr_code'] });
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        preview.srcObject = cameraStream;
        scanner.hidden = false;
        stopButton.disabled = false;
        await preview.play();
        showStatus('Đưa mã QR vào khung hình để quét.');
        scanFrames(cameraStream, detector);
      } catch (error) {
        stopCamera();
        showStatus(error.message, true);
      }
    });

    stopButton.addEventListener('click', () => {
      stopCamera();
      showStatus('Đã dừng camera.');
    });

    document.getElementById('manual-form').addEventListener('submit', event => {
      event.preventDefault();
      submitToken(tokenInput.value);
    });
  </script>
</body>
</html>
